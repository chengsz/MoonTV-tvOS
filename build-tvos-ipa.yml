name: Build Unsigned tvOS IPA

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tvos:
    name: Build MoonTV tvOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned tvOS app
        run: |
          xcodebuild \
            -project MoonTV.xcodeproj \
            -scheme MoonTV \
            -configuration Release \
            -sdk appletvos \
            -destination "generic/platform=tvOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-appletvos/MoonTV.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: MoonTV.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -r ../../MoonTV-tvOS-unsigned.ipa Payload)
          ls -lh MoonTV-tvOS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonTV-tvOS-unsigned-ipa
          path: MoonTV-tvOS-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoonTV-tvOS-unsigned.ipa
